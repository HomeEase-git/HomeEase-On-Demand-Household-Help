          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: OK }
        '404':
          description: 'Not found — includes workers that exist but aren''t KYC-approved (treated as nonexistent)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }


                geofenceRadiusMeters: { type: integer, minimum: 0, maximum: 5000, description: "0 disables the arrival distance check" }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BookingId:
      name: id
      in: path
      required: true
      schema: { type: string }
    WorkerId:
      name: workerId
      in: path
      required: true
      schema: { type: string }
    AddressId:
      name: addressId
      in: path
      required: true
      schema: { type: string }
    PaymentMethodId:
      name: methodId
      in: path
      required: true
      schema: { type: string }
    PaymentId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request body/query
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing/invalid auth token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but not permitted to perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: State/capacity/slot conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    TimeSlot:
      type: string
      enum: [MORNING, AFTERNOON, EVENING]
    KycDocumentType:
      type: string
      enum:
        - GOVERNMENT_ID_FRONT
        - GOVERNMENT_ID_BACK
        - SELFIE
        - RESUME
        - CERTIFICATION
        - NBI_CLEARANCE
        - BARANGAY_CLEARANCE
        - POLICE_CLEARANCE
        - CEDULA
        - HEALTH_CERTIFICATE
    ConditionType:
      type: string
      enum: [TIDY, NORMAL, HEAVY]
    RoomType:
      type: string
      enum: [BEDROOM, BATHROOM, KITCHEN, LIVING_ROOM, DINING_ROOM, OFFICE, GARAGE, BALCONY, OTHER]
    BookingStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - REJECTED
        - IN_PROGRESS
        # Retired with quotes (old rows only); nothing sets them now.
        - QUOTE_SUBMITTED
        - QUOTE_APPROVED
        - DISPUTED
        - PENDING_COMPLETION
        - AWAITING_PAYMENT
        - COMPLETED
        - CANCELLED

    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: {}

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer }
        message: { type: string }
        error: { type: string }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        pages: { type: integer }

    WorkerCard:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        avatar: { type: string, nullable: true }
        rating: { type: number }
        totalReviews: { type: integer }
        distance: { type: number, nullable: true, description: kilometers }
        estimatedTotal: { type: number, nullable: true }
        badges:
          type: array
          items: { type: string }
        openSlots:
          type: array
          items: { $ref: '#/components/schemas/TimeSlot' }

    CreateBookingRequest:
      type: object
      required: [serviceType, address, lat, lng, date, timeSlot]
      properties:
        workerId:
          type: string
          nullable: true
          description: Omit to trigger auto-match
        serviceType: { type: string }
        serviceTaskId: { type: string, nullable: true }
        rooms:
          type: array
          items: { $ref: '#/components/schemas/RoomType' }
        condition: { $ref: '#/components/schemas/ConditionType' }
        description: { type: string }
        address: { type: string }
        city: { type: string }
        lat: { type: number }
        lng: { type: number }
        date:
          type: string
          format: date
          description: Must be at least 2 days from today — same-day and next-day booking are blocked so workers get advance notice.
        timeSlot: { $ref: '#/components/schemas/TimeSlot' }
        addOns:
          type: array
          items:
            type: object
            required: [price]
            properties:
              id: { type: string }
              name: { type: string }
              price: { type: number }
        priorities:
          type: array
          items: { type: string }
        tip: { type: number }
        paymentMethodType:
          type: string
          enum: [GCASH, MAYA, CASH]
        paymentAccountIdentifier: { type: string }

    CreateBookingResponse:
      type: object
      properties:
        id: { type: string }
        clientName: { type: string }
        workerName: { type: string, nullable: true }
        isAutoMatched: { type: boolean }
        status: { $ref: '#/components/schemas/BookingStatus' }
        scheduledDate: { type: string, format: date }
        timeSlot: { $ref: '#/components/schemas/TimeSlot' }
        estimatedPrice: { type: number }
        estimatedDurationHours: { type: number, nullable: true }
        expiresAt: { type: string, format: date-time, description: 1 hour from creation }
        pricing:
          type: object
          properties:
            basePrice: { type: number }
            conditionFee: { type: number }
            distanceFee: { type: number }
            addOnsTotal: { type: number }
            finalEstimate: { type: number }
        payment:
          type: object
          properties:
            id: { type: string }
            status: { type: string }
            escrowStatus: { type: string }

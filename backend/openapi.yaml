openapi: 3.0.3
info:
  title: HomeEase Booking Platform API
  version: 1.1.0
  description: >
    Full REST API surface for the HomeEase household-services marketplace:
    auth, client/worker profiles, worker discovery, the booking lifecycle
    (creation/auto-match through accept/arrive/start/quote/complete/review),
    payments & PayMongo escrow, messaging, notifications, KYC verification,
    and the admin back office (users, bookings, disputes, payments, pricing
    rules, reviews, reports, analytics, audit logs, settings).
servers:
  - url: /api

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Worker Availability
  - name: Worker Discovery
  - name: Worker Profile
  - name: Bookings
  - name: Payments
  - name: Messages
  - name: Notifications
  - name: Services
  - name: KYC Verification
  - name: Admin Disputes
  - name: Admin Bookings
  - name: Admin Users
  - name: Admin Payments
  - name: Admin Pricing Rules
  - name: Admin Reviews
  - name: Admin Reports
  - name: Admin Analytics
  - name: Admin Audit Logs
  - name: Admin Settings
  - name: Webhooks

paths:
  /workers:
    get:
      tags: [Worker Discovery]
      summary: Search available workers
      security: []
      parameters:
        - name: serviceType
          in: query
          schema: { type: string }
        - name: date
          in: query
          schema: { type: string, format: date }
          description: YYYY-MM-DD
        - name: timeSlot
          in: query
          schema: { $ref: '#/components/schemas/TimeSlot' }
        - name: condition
          in: query
          schema: { $ref: '#/components/schemas/ConditionType' }
        - name: rooms
          in: query
          schema: { type: string }
          description: Comma-separated RoomType values
        - name: lat
          in: query
          schema: { type: number }
        - name: lng
          in: query
          schema: { type: number }
        - name: radius
          in: query
          schema: { type: number, default: 30 }
          description: Search radius in kilometers
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Worker cards sorted by rating desc, then distance asc
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          workers:
                            type: array
                            items: { $ref: '#/components/schemas/WorkerCard' }
                          pagination: { $ref: '#/components/schemas/Pagination' }

  /workers/{workerId}:
    get:
      tags: [Worker Discovery]
      summary: Get a worker's public profile
      security: []
      parameters: [{ $ref: '#/components/parameters/WorkerId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404':
          description: 'Not found — includes workers that exist but aren''t KYC-approved (treated as nonexistent)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /workers/me/availability-slots:
    get:
      tags: [Worker Availability]
      summary: Get the authenticated worker's per-date/timeSlot availability records
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: timeSlot
          in: query
          schema: { $ref: '#/components/schemas/TimeSlot' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          slots:
                            type: array
                            items: { $ref: '#/components/schemas/WorkerAvailabilitySlot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Worker Availability]
      summary: Open/close availability slots (max 2 per day; cannot close a booked slot)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  items:
                    type: object
                    required: [date, timeSlot]
                    properties:
                      date: { type: string, format: date }
                      timeSlot: { $ref: '#/components/schemas/TimeSlot' }
      responses:
        '200':
          description: Slots updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          slots:
                            type: array
                            items: { $ref: '#/components/schemas/WorkerAvailabilitySlot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A requested slot has an active booking and cannot be closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /workers/me/rate:
    patch:
      tags: [Worker Availability]
      summary: Set the authenticated worker's hourly rate ($20–$100)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hourlyRate]
              properties:
                hourlyRate: { type: number, minimum: 20, maximum: 100 }
      responses:
        '200':
          description: Rate updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          hourlyRate: { type: number }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /bookings:
    get:
      tags: [Bookings]
      summary: List the authenticated user's bookings (role-filtered, paginated)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Bookings]
      summary: Create a booking (auto-matches a worker if workerId is omitted)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201':
          description: Booking created; Payment authorized/held
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CreateBookingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: Not a client, or the matched/specified worker isn't KYC-approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Service type/task not found, or no worker matched the request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Worker at capacity, slot no longer available, or price outside PricingRule bounds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Get full booking detail (client, worker, or any admin)
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bookings/{id}/accept:
    patch:
      tags: [Bookings]
      summary: Worker accepts a PENDING booking
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { description: Accepted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not PENDING, or worker at capacity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /bookings/{id}/decline:
    patch:
      tags: [Bookings]
      summary: Worker declines a PENDING booking; suggests an alternative worker
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string }
                          status: { type: string, enum: [REJECTED] }
                          alternativeWorkerId: { type: string, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/arrive:
    patch:
      tags: [Bookings]
      summary: Worker checks in at the job site (must be within 100m)
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
      responses:
        '200':
          description: Arrival verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not ACCEPTED, no client location on file, or outside the geofence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /bookings/{id}/start:
    patch:
      tags: [Bookings]
      summary: Worker starts the job (requires a prior verified arrival)
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { description: Started }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not ACCEPTED, or worker hasn't checked in as arrived yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /bookings/{id}/quote:
    post:
      tags: [Bookings]
      summary: Worker submits materials cost on top of the pinned labor estimate
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [materialsCost]
              properties:
                materialsCost: { type: number, minimum: 0 }
                notes: { type: string }
      responses:
        '201': { description: Quote submitted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/quote/approve:
    patch:
      tags: [Bookings]
      summary: Client approves the submitted quote
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { description: Approved }
        '400':
          description: No quote exists on this booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/quote/dispute:
    patch:
      tags: [Bookings]
      summary: Client disputes the submitted quote (creates a Dispute, notifies admins)
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Disputed }
        '400':
          description: No quote exists on this booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/completion-photo/upload:
    post:
      tags: [Bookings]
      summary: Upload a completion proof photo (returns a URL to pass to PATCH .../complete)
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /bookings/{id}/complete:
    patch:
      tags: [Bookings]
      summary: Worker submits completion (requires QUOTE_APPROVED + a completion photo); frees capacity/slot
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completionPhotoUrl]
              properties:
                completionPhotoUrl: { type: string, format: uri }
      responses:
        '200': { description: Marked PENDING_COMPLETION }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/confirm-completion:
    patch:
      tags: [Bookings]
      summary: Client confirms completion; captures payment and releases escrow to the worker
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { description: Completed; payment captured and released }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/review:
    post:
      tags: [Bookings]
      summary: Client reviews a COMPLETED booking; updates the worker's average rating
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating: { type: number, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        '201': { description: Review submitted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new client or worker account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, phone, password, role]
              properties:
                fullName: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [CLIENT, WORKER] }
      responses:
        '201': { description: Account created; verification email/OTP sent }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK — returns access/refresh tokens and the user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user's profile
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/send-otp:
    post:
      tags: [Auth]
      summary: Send a one-time email verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: OTP sent }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify the emailed OTP; marks the account as verified
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp: { type: string }
      responses:
        '200': { description: Verified }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/resend-otp:
    post:
      tags: [Auth]
      summary: Resend the email verification OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: OTP resent }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: 'Reset email sent (always 200 — does not reveal whether the email exists)' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset the password using the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, newPassword]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { description: Password reset }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: OK — new access token }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the given refresh token (or all of the user's refresh tokens if omitted)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's full profile
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                phone: { type: string }
                avatar: { type: string }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Users]
      summary: Soft-delete the authenticated user's account
      responses:
        '200': { description: Account deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/change-password:
    post:
      tags: [Users]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/addresses:
    get:
      tags: [Users]
      summary: List the authenticated user's saved addresses
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Users]
      summary: Add a saved address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, street, city, state, zipCode]
              properties:
                label: { type: string }
                street: { type: string }
                city: { type: string }
                state: { type: string }
                zipCode: { type: string }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/addresses/{addressId}:
    patch:
      tags: [Users]
      summary: Update a saved address
      parameters: [{ $ref: '#/components/parameters/AddressId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                street: { type: string }
                city: { type: string }
                state: { type: string }
                zipCode: { type: string }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      summary: Delete a saved address
      parameters: [{ $ref: '#/components/parameters/AddressId' }]
      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/addresses/{addressId}/set-default:
    patch:
      tags: [Users]
      summary: Mark an address as the default
      parameters: [{ $ref: '#/components/parameters/AddressId' }]
      responses:
        '200': { description: Default address updated }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/payment-methods:
    get:
      tags: [Users]
      summary: List the authenticated client's saved payment methods
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Users]
      summary: Save a payment method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, accountIdentifier]
              properties:
                type: { type: string, enum: [GCASH, MAYA, CARD, BANK_TRANSFER, CASH] }
                accountIdentifier: { type: string, description: Masked account number/phone }
      responses:
        '201': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/me/payment-methods/{methodId}:
    patch:
      tags: [Users]

          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/workers/{id}:
    get:
      tags: [Admin Users]
      summary: Get a worker's detail (audit view — includes all KYC statuses, unlike the public worker-detail endpoint)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/status:
    patch:
      tags: [Admin Users]
      summary: Set a user's account status directly
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, SUSPENDED, BANNED] }
                reason: { type: string }
                notes: { type: string }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/verifications:
    get:
      tags: [Admin Users]
      summary: List verification requests
      parameters:
        - name: status
          in: query
          schema: { type: string, description: 'PENDING | SUBMITTED | APPROVED | REJECTED | ALL (default PENDING)' }
        - name: type
          in: query
          schema: { type: string, description: 'client | worker | all' }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200': { description: OK }

  /admin/verifications/{id}:
    get:
      tags: [Admin Users]
      summary: Get a verification request's detail, including its documents
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/verifications/{id}/approve:
    patch:
      tags: [Admin Users]
      summary: Approve a worker's KYC verification (sets WorkerProfile.kycStatus = APPROVED)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Approved }

  /admin/verifications/{id}/reject:
    patch:
      tags: [Admin Users]
      summary: Reject a worker's KYC verification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejectReason]
              properties:
                rejectReason: { type: string }
      responses:
        '200': { description: Rejected }

  /admin/verifications/{id}/rerun:
    patch:
      tags: [Admin Users]
      summary: Re-queue a verification request for AI review
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Re-queued; aiStatus reset to PENDING }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/suspend:
    patch:
      tags: [Admin Users]
      summary: Suspend a client or worker account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                notes: { type: string }
      responses:
        '200': { description: Suspended }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users/{id}/reinstate:
    patch:
      tags: [Admin Users]
      summary: Clear a suspension/ban
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Reinstated }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments/paymongo/webhook:
    post:
      tags: [Webhooks]
      summary: PayMongo webhook (signature-verified via the Paymongo-Signature header)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw PayMongo event payload — signature verified against the raw body, not parsed JSON.
      responses:
        '200': { description: Acknowledged }
        '401':
          description: Invalid signature
          content:
            application/json:
              schema: { type: object }
        '500':
          description: Webhook not configured (missing PAYMONGO_WEBHOOK_SECRET)
          content:
            application/json:
              schema: { type: object }

  /admin/payments:
    get:
      tags: [Admin Payments]
      summary: List all transactions
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: OK }

  /admin/payments/{id}:
    get:
      tags: [Admin Payments]
      summary: Get a transaction's detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/payments/payouts:
    get:
      tags: [Admin Payments]
      summary: List worker payouts
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: workerId
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: OK }

  /admin/payments/payouts/export:
    get:
      tags: [Admin Payments]
      summary: Export worker payouts as CSV
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: workerId
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string }

  /admin/pricing-rules:
    get:
      tags: [Admin Pricing Rules]
      summary: List city/service-type pricing bounds
      parameters:
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200': { description: OK }
    post:
      tags: [Admin Pricing Rules]
      summary: Create a pricing rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricingRuleInput' }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/pricing-rules/{id}:
    patch:
      tags: [Admin Pricing Rules]
      summary: Update a pricing rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PricingRuleInput' }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin Pricing Rules]
      summary: Delete a pricing rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/reviews:
    get:
      tags: [Admin Reviews]
      summary: List reviews (moderation view)
      parameters:
        - name: status
          in: query
          schema: { type: string, description: 'VISIBLE | HIDDEN | WARNED | all' }
        - name: flagged
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: OK }

  /admin/reviews/{id}:
    get:
      tags: [Admin Reviews]
      summary: Get a review's detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin Reviews]
      summary: Moderate a review (edit, flag, hide, or warn)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: number, minimum: 1, maximum: 5 }
                comment: { type: string, nullable: true }
                flagged: { type: boolean }
                flagReason: { type: string, nullable: true }
                status: { type: string, enum: [VISIBLE, HIDDEN, WARNED] }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/reports/service:
    get:
      tags: [Admin Reports]
      summary: Business performance summary metrics
      responses:
        '200': { description: OK }

  /admin/reports/activity:
    get:
      tags: [Admin Reports]
      summary: User engagement/activity metrics
      responses:
        '200': { description: OK }

  /admin/analytics:
    get:
      tags: [Admin Analytics]
      summary: Platform analytics (bookings/revenue/growth trends)
      responses:
        '200': { description: OK }

  /admin/audit-logs:
    get:
      tags: [Admin Audit Logs]
      summary: List system/admin-action audit log entries
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string, description: 'ADMIN_ACTION | LOGIN_HISTORY | SYSTEM_ERROR | STATUS_CHANGE | all' }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: OK }

  /admin/dashboard/stats:
    get:
      tags: [Admin Analytics]
      summary: Dashboard summary stats (headline KPIs)
      responses:
        '200': { description: OK }

  /admin/settings:
    get:
      tags: [Admin Settings]
      summary: Get platform settings (commission/tax rates, capacity, geofence, etc.)
      responses:
        '200': { description: OK }
    put:
      tags: [Admin Settings]
      summary: Update platform settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [siteName, supportEmail]
              properties:
                siteName: { type: string }
                supportEmail: { type: string, format: email }
                notificationsEnabled: { type: boolean }
                commissionRate: { type: number, minimum: 0, maximum: 1 }
                withholdingTaxRate: { type: number, minimum: 0, maximum: 1 }
                maxSlotsPerDay: { type: integer, minimum: 1, maximum: 24 }
                pendingExpiryMinutes: { type: integer, minimum: 5, maximum: 10080 }
                geofenceRadiusMeters: { type: integer, minimum: 10, maximum: 5000 }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BookingId:
      name: id
      in: path
      required: true
      schema: { type: string }
    WorkerId:
      name: workerId
      in: path
      required: true
      schema: { type: string }
    AddressId:
      name: addressId
      in: path
      required: true
      schema: { type: string }
    PaymentMethodId:
      name: methodId
      in: path
      required: true
      schema: { type: string }
    PaymentId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request body/query
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing/invalid auth token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated but not permitted to perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: State/capacity/slot conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    TimeSlot:
      type: string
      enum: [MORNING, AFTERNOON, EVENING]
    KycDocumentType:
      type: string
      enum:
        - GOVERNMENT_ID_FRONT
        - GOVERNMENT_ID_BACK
        - SELFIE
        - RESUME
        - CERTIFICATION
        - NBI_CLEARANCE
        - BARANGAY_CLEARANCE
        - POLICE_CLEARANCE
        - CEDULA
    PricingRuleInput:
      type: object
      required: [city, serviceType, minPrice, maxPrice]
      properties:
        city: { type: string }
        serviceType: { type: string }
        minPrice: { type: number }
        maxPrice: { type: number }
    ConditionType:
      type: string
      enum: [TIDY, NORMAL, HEAVY]
    RoomType:
      type: string
      enum: [BEDROOM, BATHROOM, KITCHEN, LIVING_ROOM, DINING_ROOM, OFFICE, GARAGE, BALCONY, OTHER]
    BookingStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - REJECTED
        - IN_PROGRESS
        - QUOTE_SUBMITTED
        - QUOTE_APPROVED
        - DISPUTED
        - PENDING_COMPLETION
        - COMPLETED
        - CANCELLED

    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: {}

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer }
        message: { type: string }
        error: { type: string }

    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        pages: { type: integer }

    WorkerAvailabilitySlot:
      type: object
      properties:
        id: { type: string }
        workerProfileId: { type: string }
        date: { type: string, format: date }
        timeSlot: { $ref: '#/components/schemas/TimeSlot' }
        isBlocked: { type: boolean }
        isBooked: { type: boolean }

    WorkerCard:
      type: object
      properties:
        id: { type: string }
        fullName: { type: string }
        avatar: { type: string, nullable: true }
        rating: { type: number }
        totalReviews: { type: integer }
        distance: { type: number, nullable: true, description: kilometers }
        hourlyRate: { type: number, nullable: true }
        estimatedTotal: { type: number, nullable: true }
        badges:
          type: array
          items: { type: string }
        openSlots:
          type: array
          items: { $ref: '#/components/schemas/TimeSlot' }

    CreateBookingRequest:
      type: object
      required: [serviceType, address, lat, lng, date, timeSlot]
      properties:
        workerId:
          type: string
          nullable: true
          description: Omit to trigger auto-match
        serviceType: { type: string }
        serviceTaskId: { type: string, nullable: true }
        rooms:
          type: array
          items: { $ref: '#/components/schemas/RoomType' }
        condition: { $ref: '#/components/schemas/ConditionType' }
        description: { type: string }
        address: { type: string }
        city: { type: string }
        lat: { type: number }
        lng: { type: number }
        date: { type: string, format: date }
        timeSlot: { $ref: '#/components/schemas/TimeSlot' }
        addOns:
          type: array
          items:
            type: object
            required: [price]
            properties:
              id: { type: string }
              name: { type: string }
              price: { type: number }
        priorities:
          type: array
          items: { type: string }
        tip: { type: number }
        paymentMethodType:
          type: string
          enum: [GCASH, MAYA, CARD, BANK_TRANSFER, CASH]
        paymentAccountIdentifier: { type: string }

    CreateBookingResponse:
      type: object
      properties:
        id: { type: string }
        clientName: { type: string }
        workerName: { type: string, nullable: true }
        isAutoMatched: { type: boolean }
        status: { $ref: '#/components/schemas/BookingStatus' }
        scheduledDate: { type: string, format: date }
        timeSlot: { $ref: '#/components/schemas/TimeSlot' }
        estimatedPrice: { type: number }
        estimatedDurationHours: { type: number, nullable: true }
        expiresAt: { type: string, format: date-time, description: 1 hour from creation }
        pricing:
          type: object
          properties:
            basePrice: { type: number }
            conditionFee: { type: number }
            distanceFee: { type: number }
            addOnsTotal: { type: number }
            finalEstimate: { type: number }
        payment:
          type: object
          properties:
            id: { type: string }
            status: { type: string }
            escrowStatus: { type: string }
            clientSecret:
              type: string
              nullable: true
              description: PayMongo Payment Intent client key (CARD only) for client-side confirmation

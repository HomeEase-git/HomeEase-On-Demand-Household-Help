openapi: 3.0.3
info:
  title: HomeEase Booking Platform API
  version: 1.1.0
  description: >
    Full REST API surface for the HomeEase household-services marketplace:
    auth, client/worker profiles, worker discovery, the booking lifecycle
    (creation/auto-match through accept/arrive/start/invoice/payment/review),
    payments & Xendit escrow, messaging, notifications, KYC verification,
    and the admin back office (users, bookings, disputes, payments, pricing
    rules, reviews, reports, analytics, audit logs, settings).
servers:
  - url: /api

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Worker Availability
  - name: Worker Discovery
  - name: Worker Profile
  - name: Bookings
  - name: Payments
  - name: Messages
  - name: Notifications
  - name: Services
  - name: KYC Verification
  - name: Admin Disputes
  - name: Admin Bookings
  - name: Admin Users
  - name: Admin Payments
  - name: Admin Reviews
  - name: Admin Reports
  - name: Admin Analytics
  - name: Admin Audit Logs
  - name: Admin Settings
  - name: Webhooks

paths:
  /workers:
    get:
      tags: [Worker Discovery]
      summary: Search available workers
      security: []
      parameters:
        - name: serviceType
          in: query
          schema: { type: string }
        - name: date
          in: query
          schema: { type: string, format: date }
          description: YYYY-MM-DD
        - name: timeSlot
          in: query
          schema: { $ref: '#/components/schemas/TimeSlot' }
        - name: scopeAnswers
          in: query
          schema: { type: string }
          description: >-
            JSON object string, keyed by ServiceScopeField.label (e.g.
            {"Appliance Type":"Air Conditioner"}). Only fields the admin
            flagged usedForMatching actually filter candidates — see
            matchingService.buildCapabilityFilters.
        - name: hasPets
          in: query
          schema: { type: boolean }
        - name: serviceTaskId
          in: query
          schema: { type: string }
          description: When given, prices the estimatedTotal off this task's basePrice instead of the category's.
        - name: lat
          in: query
          schema: { type: number }
        - name: lng
          in: query
          schema: { type: number }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: >-
            Worker cards sorted by rating desc, then totalReviews desc —
            there is no proximity-based sort. estimatedTotal is a real
            per-job price (same formula as POST /bookings, see
            utils/pricing.computeJobPricing) — it factors in distance only
            when lat/lng are supplied and the worker has an address on file.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          workers:
                            type: array
                            items: { $ref: '#/components/schemas/WorkerCard' }
                          pagination: { $ref: '#/components/schemas/Pagination' }

  /workers/{workerId}:
    get:
      tags: [Worker Discovery]
      summary: Get a worker's public profile
      security: []
      parameters: [{ $ref: '#/components/parameters/WorkerId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '404':
          description: 'Not found — includes workers that exist but aren''t KYC-approved (treated as nonexistent)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /bookings:
    get:
      tags: [Bookings]
      summary: List the authenticated user's bookings (role-filtered, paginated)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Bookings]
      summary: Create a booking (auto-matches a worker if workerId is omitted)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201':
          description: Booking created; Payment authorized/held
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CreateBookingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: Not a client, or the matched/specified worker isn't KYC-approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Service type/task not found, or no worker matched the request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Worker at capacity or slot no longer available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Get full booking detail (client, worker, or any admin)
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bookings/{id}/accept:
    patch:
      tags: [Bookings]
      summary: Worker accepts a PENDING booking
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { description: Accepted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not PENDING, or worker at capacity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /bookings/{id}/decline:
    patch:
      tags: [Bookings]
      summary: Worker declines a PENDING booking; suggests an alternative worker
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string }
                          status: { type: string, enum: [REJECTED] }
                          alternativeWorkerId: { type: string, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/arrive:
    patch:
      tags: [Bookings]
      summary: Worker checks in at the job site (must be within 100m)
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
                accuracy:
                  type: number
                  nullable: true
                  description: >-
                    Optional device-reported GPS accuracy radius in meters.
                    When present and worse than ~100m, the check-in is
                    rejected as too imprecise to trust — a basic sanity
                    bound, not device attestation.
      responses:
        '200':
          description: Arrival verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not ACCEPTED, no client location on file, outside the geofence, or GPS accuracy too imprecise
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /bookings/{id}/client-not-here:
    patch:
      tags: [Bookings]
      summary: Worker at the door alerts the client (must have checked in). noShowGraceMinutes after the alert, and never before the booked start plus that grace, the worker can cancel with fault CLIENT and no proof; the fee is auto-approved. Not offered when the check-in was flagged outside the booked window
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200':
          description: Client alerted (repeat calls return the first alert time)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          clientNotHereAt: { type: string, format: date-time }
                          canCancelAt:
                            type: string
                            format: date-time
                            nullable: true
                            description: max(clientNotHereAt, booked start) + noShowGraceMinutes. Null when the check-in was outside the booked window (cancel with proof instead)
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not ACCEPTED, or the worker has not checked in at the job site
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /bookings/{id}/start:
    patch:
      tags: [Bookings]
      summary: Worker starts the job from ACCEPTED (requires a prior verified arrival and a before photo), at the price the client booked
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { description: Started }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not ACCEPTED, or worker hasn't checked in as arrived yet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /workers/me/calendar:
    get:
      tags: [Worker Availability]
      summary: The worker's availability calendar (weekly schedule, date overrides, jobs per day)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: 'availableDays, isAvailable, today and one entry per day (available, overridden, jobCount, jobs)' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workers/me/weekly-schedule:
    put:
      tags: [Worker Availability]
      summary: Set the weekdays the worker normally works (0=Sun ... 6=Sat)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availableDays]
              properties:
                availableDays: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
      responses:
        '200': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workers/me/date-overrides:
    put:
      tags: [Worker Availability]
      summary: Open or close specific dates (null returns them to the weekly schedule)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dates, isAvailable]
              properties:
                dates: { type: array, items: { type: string, format: date } }
                isAvailable: { type: boolean, nullable: true }
      responses:
        '200': { description: Saved }
        '409': { description: A date being closed has an accepted job }

  /bookings/{id}/completion-photo/upload:
    post:
      tags: [Bookings]
      summary: Upload a completion proof photo (returns a URL to pass to PATCH .../complete)
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /bookings/{id}/complete:
    patch:
      tags: [Bookings]
      summary: Worker finishes the job and sends the invoice (IN_PROGRESS + a progress photo + a completion photo). Parts and extra work are added as lines with photos; there is no approval step. Cash waits in PENDING_COMPLETION for Cash received; GCash/Maya gets its Xendit invoice (AWAITING_PAYMENT)
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completionPhotoUrl]
              properties:
                completionPhotoUrl: { type: string, format: uri }
                items:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [kind, name, price, photoUrls]
                    properties:
                      kind: { type: string, enum: [PART, EXTRA_WORK] }
                      name: { type: string, maxLength: 120 }
                      price: { type: number, minimum: 0.01, maximum: 100000 }
                      photoUrls:
                        type: array
                        minItems: 1
                        maxItems: 5
                        items: { type: string, format: uri }
                        description: PART — the receipt. EXTRA_WORK — the work done. The worker's own booking photos only.
      responses:
        '200': { description: Invoice sent; returns the status and the invoice total }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/confirm-completion:
    patch:
      tags: [Bookings]
      summary: Pay now — returns the Xendit checkout for a GCash/Maya invoice (PENDING_COMPLETION or AWAITING_PAYMENT). Refused (409) for cash, which the worker confirms
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { description: Checkout URL, or COMPLETED if Xendit already shows it paid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/cash-received:
    patch:
      tags: [Bookings]
      summary: Worker confirms the client paid a cash invoice (PENDING_COMPLETION) — settles it to COMPLETED. Refused while the client has reported the invoice
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { description: Cash payment recorded }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/cash-not-paid:
    patch:
      tags: [Bookings]
      summary: Worker reports the client has not paid a cash invoice (PENDING_COMPLETION) — booking goes DISPUTED, admins and the client are notified. No body
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { description: Reported; returns id, status DISPUTED and the disputeId }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/invoice/report:
    patch:
      tags: [Bookings]
      summary: Client reports the invoice before paying (PENDING_COMPLETION or AWAITING_PAYMENT) — booking goes DISPUTED, an unpaid GCash/Maya invoice is voided, admins are notified
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
                evidenceUrls: { type: array, maxItems: 5, items: { type: string, format: uri } }
      responses:
        '200': { description: Reported; returns the disputeId }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /bookings/{id}/problem:
    post:
      tags: [Bookings]
      summary: Client reports a problem on an ACCEPTED or IN_PROGRESS booking — pings a late worker (or cancels as a no-show past the grace time), asks the worker to agree to cancel, or opens a dispute for an admin
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [WORKER_NOT_HERE, WORKER_STOPPED, NEED_TO_CANCEL, OTHER] }
                note: { type: string, maxLength: 500, description: Required (10+ characters) for OTHER }
      responses:
        '200':
          description: What happened
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          outcome: { type: string, enum: [WORKER_PINGED, CANCELLED, CANCEL_REQUESTED, REPORTED] }
                          autoCancelAt: { type: string, format: date-time, description: Only for WORKER_PINGED }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: The worker was already pinged in the last 15 minutes }

  /bookings/{id}/cancel-request/respond:
    patch:
      tags: [Bookings]
      summary: Worker answers the client's cancel request — agreeing cancels with no penalty, declining sends it to an admin as a dispute
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
      responses:
        '200': { description: Cancelled, or escalated to an admin }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: There is no open cancel request to answer }

  /bookings/{id}/review:
    post:
      tags: [Bookings]
      summary: Client reviews a COMPLETED booking; updates the worker's average rating
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating: { type: number, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        '201': { description: Review submitted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new client or worker account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, phone, password, role]
              properties:
                fullName: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [CLIENT, WORKER] }
      responses:
        '201': { description: Account created; verification email/OTP sent }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK — returns access/refresh tokens and the user profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the authenticated user's profile
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/send-otp:
    post:
      tags: [Auth]
      summary: Send a one-time email verification code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: OTP sent }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify the emailed OTP; marks the account as verified
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp: { type: string }
      responses:
        '200': { description: Verified }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/resend-otp:
    post:
      tags: [Auth]
      summary: Resend the email verification OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: OTP resent }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: 'Reset email sent (always 200 — does not reveal whether the email exists)' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset the password using the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, newPassword]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { description: Password reset }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: OK — new access token }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the given refresh token (or all of the user's refresh tokens if omitted)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user's full profile
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      summary: Update the authenticated user's profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                phone: { type: string }
                avatar: { type: string }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Users]
      summary: Soft-delete the authenticated user's account
      responses:
        '200': { description: Account deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/change-password:
    post:
      tags: [Users]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/addresses:
    get:
      tags: [Users]
      summary: List the authenticated user's saved addresses
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Users]
      summary: Add a saved address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, street, city, state, zipCode]
              properties:
                label: { type: string }
                street: { type: string }
                city: { type: string }
                state: { type: string }
                zipCode: { type: string }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/me/addresses/{addressId}:
    patch:
      tags: [Users]
      summary: Update a saved address
      parameters: [{ $ref: '#/components/parameters/AddressId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                street: { type: string }
                city: { type: string }
                state: { type: string }
                zipCode: { type: string }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      summary: Delete a saved address
      parameters: [{ $ref: '#/components/parameters/AddressId' }]
      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/addresses/{addressId}/set-default:
    patch:
      tags: [Users]
      summary: Mark an address as the default
      parameters: [{ $ref: '#/components/parameters/AddressId' }]
      responses:
        '200': { description: Default address updated }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/payment-methods:
    get:
      tags: [Users]
      summary: List the authenticated client's saved payment methods
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Users]
      summary: Save a payment method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, accountIdentifier]
              properties:
                type: { type: string, enum: [GCASH, MAYA, CASH] }
                accountIdentifier: { type: string, description: Masked account number/phone }
      responses:
        '201': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/me/payment-methods/{methodId}:
    patch:
      tags: [Users]
      summary: Rename a saved payment method
      parameters: [{ $ref: '#/components/parameters/PaymentMethodId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      summary: Remove a saved payment method
      parameters: [{ $ref: '#/components/parameters/PaymentMethodId' }]
      responses:
        '200': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/payment-methods/{methodId}/set-default:
    patch:
      tags: [Users]
      summary: Mark a payment method as the default
      parameters: [{ $ref: '#/components/parameters/PaymentMethodId' }]
      responses:
        '200': { description: Default payment method updated }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/notification-preferences:
    patch:
      tags: [Users]
      summary: Update notification preferences
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bookingUpdates: { type: boolean }
                messages: { type: boolean }
                promotions: { type: boolean }
                systemNotifications: { type: boolean }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/me/avatar:
    post:
      tags: [Users]
      summary: Upload a profile avatar image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          avatar: { type: string, format: uri }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/me/kyc-documents:
    get:
      tags: [Users]
      summary: List the authenticated user's submitted KYC documents (legacy, pre-VerificationRequest flow)
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Users]
      summary: Record a KYC document already uploaded elsewhere
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentType, documentUrl]
              properties:
                documentType: { $ref: '#/components/schemas/KycDocumentType' }
                documentUrl: { type: string, format: uri }
      responses:
        '201': { description: Recorded }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/me/kyc-documents/upload:
    post:
      tags: [Users]
      summary: Upload a single KYC document file (PDF/JPG/PNG/WEBP)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Uploaded }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/me/contract-acceptance:
    post:
      tags: [Users]
      summary: Record acceptance of a legal contract (worker service agreement / client user agreement)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contractType]
              properties:
                contractType: { type: string, enum: [WORKER_SERVICE_AGREEMENT, CLIENT_USER_AGREEMENT] }
                acceptedAt: { type: string, format: date-time }
      responses:
        '201': { description: Recorded }
        '400': { $ref: '#/components/responses/BadRequest' }

  /users/me/reviews:
    get:
      tags: [Users]
      summary: List reviews written by (client) or received by (worker) the authenticated user
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workers/{workerId}/reviews:
    get:
      tags: [Worker Discovery]
      summary: List a worker's reviews
      security: []
      parameters: [{ $ref: '#/components/parameters/WorkerId' }]
      responses:
        '200': { description: OK }
        '404':
          description: 'Not found — includes workers that exist but aren''t KYC-approved (treated as nonexistent)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /workers/{workerId}/availability:
    get:
      tags: [Worker Discovery]
      summary: Get a worker's open availability slots
      security: []
      parameters:
        - { $ref: '#/components/parameters/WorkerId' }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: OK }
        '404':
          description: 'Not found — includes workers that exist but aren''t KYC-approved (treated as nonexistent)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /workers/{workerId}/blocked-dates:
    get:
      tags: [Worker Discovery]
      summary: Get a worker's fully-blocked dates (no open slots)
      security: []
      parameters: [{ $ref: '#/components/parameters/WorkerId' }]
      responses:
        '200': { description: OK }
        '404':
          description: 'Not found — includes workers that exist but aren''t KYC-approved (treated as nonexistent)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /workers/me/availability:
    patch:
      tags: [Worker Profile]
      summary: Set overall availability and default available days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isAvailable]
              properties:
                isAvailable: { type: boolean }
                availableDays:
                  type: array
                  items: { type: integer, minimum: 0, maximum: 6 }
                  description: 0=Sun … 6=Sat
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workers/me/profile:
    patch:
      tags: [Worker Profile]
      summary: Update the worker's profile fields
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bio: { type: string }
                serviceAreaRadius: { type: number, minimum: 0 }
                address: { type: string }
                city: { type: string }
                state: { type: string }
                zipCode: { type: string }
                resumeUrl: { type: string }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workers/me/service-types:
    get:
      tags: [Worker Profile]
      summary: List the authenticated worker's service category connections
      description: >-
        Includes connections still PENDING_VERIFICATION or REJECTED, not just
        VERIFIED ones — the mobile skills screen needs the full picture to
        render each category's status.
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Worker Profile]
      summary: Add one service category to the worker's profile
      description: >-
        The worker's first category is VERIFIED immediately (gated only by
        ServiceType.requiresCertification). Every category beyond the first
        always requires a single-document Certification review, regardless of
        that flag, and starts PENDING_VERIFICATION until an admin approves the
        gating certification — see /admin/certifications/{id}/approve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceTypeId]
              properties:
                serviceTypeId: { type: string }
                certificationId:
                  type: string
                  description: An existing PENDING Certification already tagged to this serviceTypeId.
                certification:
                  type: object
                  description: Inline certification to create if certificationId isn't given.
                  properties:
                    title: { type: string }
                    issuer: { type: string }
                    issueDate: { type: string, format: date }
                    expiryDate: { type: string, format: date }
                    documentUrl: { type: string }
      responses:
        '201': { description: Added or submitted for review }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Missing an admin-approved certification for a requiresCertification category }

  /workers/me/service-types/{serviceTypeId}:
    delete:
      tags: [Worker Profile]
      summary: Remove a whole service category from the worker's profile
      parameters:
        - name: serviceTypeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers/me/task-catalog:
    get:
      tags: [Worker Profile]
      summary: Full admin task catalog annotated with this worker's category/selection/price state
      description: >-
        Consolidated read for the task-first "Skills & Services" screen —
        every active ServiceType/ServiceTask, grouped by category, each task
        annotated with this worker's own WorkerTaskSelection and each
        category with its
        WorkerServiceCategory status.
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workers/me/task-selections/{serviceTaskId}:
    put:
      tags: [Worker Profile]
      summary: Select a task (worker offers this task)
      description: >-
        The task-first counterpart to POST /workers/me/service-types. If the
        task's parent category isn't connected yet (or was REJECTED), runs
        the same category gate first, passing through certificationId/
        certification.
      parameters:
        - name: serviceTaskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                certificationId: { type: string }
                certification:
                  type: object
                  properties:
                    title: { type: string }
                    issuer: { type: string }
                    issueDate: { type: string, format: date }
                    expiryDate: { type: string, format: date }
                    documentUrl: { type: string }
      responses:
        '200': { description: Selected }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Worker Profile]
      summary: Deselect a task
      description: >-
        If this was the last active selection under the task's category, the
        WorkerServiceCategory connection is removed too.
      parameters:
        - name: serviceTaskId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deselected }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers/me/capabilities:
    get:
      tags: [Worker Profile]
      summary: List the ServiceScopeFieldOption ids this worker has declared they handle
      description: >-
        Replaces the old free-text skill list. Every id here is a real
        admin-defined option (see ServiceScopeField.usedForMatching) — nothing
        is typed by the worker. Used by worker discovery
        (GET /workers, and "surprise me" auto-match) to only show/match
        workers who've declared the option a client asked for; a worker with
        no declarations for a given field is left unrestricted for it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          optionIds: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Worker Profile]
      summary: Replace this worker's declared capability option ids
      description: >-
        Replace-all — pass every option id currently declared. Every id must
        belong to a ServiceScopeField.usedForMatching field on a ServiceType
        this worker already offers (see /workers/me/service-types), or the
        request is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionIds]
              properties:
                optionIds: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          optionIds: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /workers/me/certifications:
    get:
      tags: [Worker Profile]
      summary: List the authenticated worker's certifications
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Worker Profile]
      summary: Add a certification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, issuer, issueDate, documentUrl]
              properties:
                name: { type: string }
                issuer: { type: string }
                issueDate: { type: string, format: date }
                expiryDate: { type: string, format: date, nullable: true }
                documentUrl: { type: string, format: uri }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/BadRequest' }

  /workers/me/certifications/{certId}:
    get:
      tags: [Worker Profile]
      summary: Get a certification's detail (including verification status)
      parameters:
        - name: certId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Worker Profile]
      summary: Remove a certification
      parameters:
        - name: certId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /workers/me/payout:
    get:
      tags: [Worker Profile]
      summary: Get the authenticated worker's payout method
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Worker Profile]
      summary: Set the authenticated worker's payout method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payoutMethod]
              properties:
                payoutMethod: { type: string, enum: [GCASH, MAYA] }
                payoutAccountName: { type: string }
                payoutAccountNumber: { type: string }
      responses:
        '200': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }

  /bookings/{id}/cancel:
    patch:
      tags: [Bookings]
      summary: Client or worker cancels a booking before completion
      description: |
        A worker who has checked in must give `fault` (CLIENT or WORKER), a reason (10+ characters) and 1-5 proof photos;
        a CLIENT-fault claim goes to admin review (PENDING_REVIEW). Exception: after `/client-not-here`, once its
        `canCancelAt` has passed, `{ fault: CLIENT }` alone cancels with no proof and the fee is auto-approved
        (APPROVED), or NOT_APPLICABLE when the admin fee setting is 0. Before the booked start a worker who has not
        checked in sends `workerCancellationReason`.
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                fault: { type: string, enum: [CLIENT, WORKER] }
                proofUrls: { type: array, maxItems: 5, items: { type: string, format: uri } }
                workerCancellationReason: { type: string, enum: [WORKER_FAULT, CLIENT_NO_SHOW, OTHER] }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string }
                          status: { type: string }
                          penaltyAmount: { type: number, nullable: true }
                          compensationStatus: { type: string, enum: [APPROVED, NOT_APPLICABLE, PENDING_REVIEW] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/{bookingId}:
    post:
      tags: [Payments]
      summary: Create a Payment record for a booking (client only)
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Payments]
      summary: Get the payment detail for a booking
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payments:
    get:
      tags: [Payments]
      summary: List the authenticated user's payments (client) or payouts (worker)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /payments/{id}/release:
    post:
      tags: [Payments]
      summary: Client manually releases held escrow to the worker
      parameters: [{ $ref: '#/components/parameters/PaymentId' }]
      responses:
        '200': { description: Released }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/{id}/refund:
    post:
      tags: [Payments]
      summary: Client refunds a held payment
      parameters: [{ $ref: '#/components/parameters/PaymentId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: Refunded }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/{bookingId}/xendit/checkout:
    post:
      tags: [Payments]
      summary: Create a Xendit Invoice checkout (GCash/Maya) for an existing pending payment
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200':
          description: OK — returns the Xendit hosted checkout URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          checkoutUrl: { type: string, format: uri }
                          invoiceId: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/dues:
    post:
      tags: [Payments]
      summary: Worker pays down their platform dues (commission owed) through a Xendit invoice
      description: >
        Worker only. `amount` omitted means the full balance; otherwise it must be at least half of
        what is owed (never below Xendit's minimum invoice) and no more than what is owed. One open
        invoice per worker: if one is still live its checkout URL is returned instead of a new one.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number, description: Pesos to pay; omit for the full balance }
      responses:
        '200':
          description: OK — returns the Xendit hosted checkout URL, or `alreadyPaid` if it was already settled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          checkoutUrl: { type: string, format: uri }
                          debtPaymentId: { type: string }
                          amount: { type: number }
                          alreadyPaid: { type: boolean }
        '400': { description: Nothing owed, or the amount is out of range }
        '403': { $ref: '#/components/responses/Forbidden' }

  /messages/unread-count:
    get:
      tags: [Messages]
      summary: Get the authenticated user's unread message count
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /messages/conversations:
    get:
      tags: [Messages]
      summary: List the authenticated user's conversations
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /messages/conversations/{userId}:
    get:
      tags: [Messages]
      summary: Get the message thread with another user
      parameters:
        - name: userId
          in: path

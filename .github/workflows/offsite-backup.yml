name: Off-site backup

# Nightly encrypted copy of the database and every uploaded file, kept at a
# second provider (backend/scripts/offsite-backup.sh; docs/DATA-RESILIENCE.md,
# "Off-site backup"). Each night's database copy is restored into a scratch
# database here and checked before it's uploaded. A failed run emails the
# repository owner.
#
# Pull requests that touch the backup run `self-test` instead: the whole
# backup and restore round trip against throwaway services, no production
# data or secrets involved.
#
# Needs (Settings -> Secrets and variables -> Actions):
#   Secrets    BACKUP_DATABASE_URL (homeease_readonly, direct host),
#              OFFSITE_ACCESS_KEY_ID, OFFSITE_SECRET_ACCESS_KEY,
#              SUPABASE_S3_ACCESS_KEY_ID, SUPABASE_S3_SECRET_ACCESS_KEY
#   Variables  AGE_RECIPIENT, OFFSITE_ENDPOINT, OFFSITE_REGION, OFFSITE_BUCKET,
#              SUPABASE_S3_ENDPOINT, SUPABASE_S3_REGION

on:
  schedule:
    - cron: '17 18 * * *' # 02:17 Philippine time
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/offsite-backup.yml
      - backend/scripts/offsite-*.sh
      - backend/scripts/restore-drill.ts
      - backend/scripts/db-roles.ts

permissions:
  contents: read

concurrency:
  group: offsite-backup-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AGE_VERSION: 1.3.2
  AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
  # apt.postgresql.org signing key
  PGDG_KEY_FINGERPRINT: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8

jobs:
  backup:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      verify:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DIRECT_URL: postgresql://unused@localhost/unused
      - name: Install PostgreSQL 18 client and age
        run: &install-tools |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSfL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | grep -q "^fpr:::::::::${PGDG_KEY_FINGERPRINT}:"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 > /dev/null
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          curl -sSfL -o /tmp/age.tgz "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  /tmp/age.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/age.tgz -C /usr/local/bin --strip-components=1 age/age age/age-keygen
      - name: Back up
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          VERIFY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/verify
          AGE_RECIPIENT: ${{ vars.AGE_RECIPIENT }}
          OFFSITE_ENDPOINT: ${{ vars.OFFSITE_ENDPOINT }}
          OFFSITE_REGION: ${{ vars.OFFSITE_REGION }}
          OFFSITE_BUCKET: ${{ vars.OFFSITE_BUCKET }}
          OFFSITE_ACCESS_KEY_ID: ${{ secrets.OFFSITE_ACCESS_KEY_ID }}
          OFFSITE_SECRET_ACCESS_KEY: ${{ secrets.OFFSITE_SECRET_ACCESS_KEY }}
          SUPABASE_S3_ENDPOINT: ${{ vars.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ vars.SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: bash scripts/offsite-backup.sh

  self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      source:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      scratch:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verify
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SOURCE_URL: postgresql://postgres:postgres@localhost:5432/source
      # Stand-ins: port 5055 plays Supabase Storage, 5056 the off-site bucket.
      SUPABASE_S3_ENDPOINT: http://127.0.0.1:5055
      OFFSITE_ENDPOINT: http://127.0.0.1:5056
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DIRECT_URL: postgresql://unused@localhost/unused
      - name: Install PostgreSQL 18 client and age
        run: *install-tools
      - name: Start S3 stand-ins
        run: |
          pipx install --quiet "moto[server]==5.2.3"
          nohup moto_server -H 127.0.0.1 -p 5055 > /tmp/moto-supabase.log 2>&1 &
          nohup moto_server -H 127.0.0.1 -p 5056 > /tmp/moto-offsite.log 2>&1 &
          for port in 5055 5056; do
            for _ in $(seq 1 30); do curl -sf "http://127.0.0.1:$port/moto-api/" > /dev/null && break; sleep 1; done
          done
      - name: Prepare a source database, files and a test key
        env:
          DIRECT_URL: ${{ env.SOURCE_URL }}
          APP_DB_PASSWORD: selftest-app-password
          READONLY_DB_PASSWORD: selftest-readonly-password
        run: |
          npx prisma migrate deploy
          npx tsx scripts/db-roles.ts
          psql "$SOURCE_URL" -c "INSERT INTO \"User\" (id, email, password, \"fullName\", role, \"updatedAt\") VALUES ('selftest', 'selftest@homeease.invalid', '!', 'Self Test', 'CLIENT', now() AT TIME ZONE 'UTC')"
          mkdir -p /tmp/seed/kyc-documents/user-1 /tmp/seed/avatars
          echo "id card" > /tmp/seed/kyc-documents/user-1/id.png
          echo "selfie" > "/tmp/seed/kyc-documents/user-1/selfie photo.jpg"
          echo "avatar" > /tmp/seed/avatars/a.png
          for bucket in kyc-documents avatars; do
            aws --endpoint-url "$SUPABASE_S3_ENDPOINT" s3 mb "s3://$bucket" > /dev/null
            aws --endpoint-url "$SUPABASE_S3_ENDPOINT" s3 sync "/tmp/seed/$bucket" "s3://$bucket" --only-show-errors
          done
          aws --endpoint-url "$OFFSITE_ENDPOINT" s3 mb s3://offsite > /dev/null
          age-keygen -o /tmp/test.key 2> /dev/null
          echo "AGE_RECIPIENT=$(age-keygen -y /tmp/test.key)" >> "$GITHUB_ENV"
      - name: Back up (every bucket, as homeease_readonly)
        env:
          BACKUP_DATABASE_URL: postgresql://homeease_readonly:selftest-readonly-password@localhost:5432/source
          VERIFY_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/verify
          OFFSITE_REGION: us-east-1
          OFFSITE_BUCKET: offsite
          OFFSITE_ACCESS_KEY_ID: test
          OFFSITE_SECRET_ACCESS_KEY: test
          SUPABASE_S3_REGION: us-east-1
          SUPABASE_S3_ACCESS_KEY_ID: test
          SUPABASE_S3_SECRET_ACCESS_KEY: test
        run: bash scripts/offsite-backup.sh
      - name: Restore it and compare
        env:
          OFFSITE_REGION: us-east-1
          OFFSITE_BUCKET: offsite
          OFFSITE_ACCESS_KEY_ID: test
          OFFSITE_SECRET_ACCESS_KEY: test
        run: |
          psql postgresql://postgres:postgres@localhost:5433/verify -c "CREATE DATABASE restored"
          bash scripts/offsite-restore.sh latest /tmp/test.key /tmp/restored --restore-db postgresql://postgres:postgres@localhost:5433/restored
          diff -r /tmp/seed /tmp/restored/files
          for table in User _prisma_migrations; do
            a=$(psql -tA "$SOURCE_URL" -c "SELECT count(*) FROM \"$table\"")
            b=$(psql -tA postgresql://postgres:postgres@localhost:5433/restored -c "SELECT count(*) FROM \"$table\"")
            echo "$table: source $a, restored $b"
            [ "$a" = "$b" ]
          done
          # A wrong key and a damaged copy must both be refused. (Not `! cmd`:
          # bash -e ignores a failed negation.)
          refused() { if "$@"; then echo "::error::was not refused: $*"; exit 1; fi; }
          age-keygen -o /tmp/wrong.key 2> /dev/null
          refused bash scripts/offsite-restore.sh latest /tmp/wrong.key /tmp/wrong
          stamp=$(aws --endpoint-url "$OFFSITE_ENDPOINT" s3 ls s3://offsite/ | awk '{print $2}' | tr -d /)
          aws --endpoint-url "$OFFSITE_ENDPOINT" s3 cp "s3://offsite/$stamp/db.dump.age" /tmp/copy.age --only-show-errors
          printf 'x' >> /tmp/copy.age
          aws --endpoint-url "$OFFSITE_ENDPOINT" s3 cp /tmp/copy.age "s3://offsite/$stamp/db.dump.age" --only-show-errors
          refused bash scripts/offsite-restore.sh latest /tmp/test.key /tmp/damaged

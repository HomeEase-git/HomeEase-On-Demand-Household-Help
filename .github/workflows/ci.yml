name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeease_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeease_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/homeease_ci
      NODE_ENV: test
      PORT: 3000
      APP_URL: http://localhost:3000
      JWT_SECRET: ci-test-jwt-secret
      JWT_EXPIRY: 1h
      SMTP_USER: ci-test@example.com
      SMTP_PASS: ci-test-app-password
      XENDIT_SECRET_KEY: ci-test-secret
      XENDIT_WEBHOOK_TOKEN: ci-test-webhook-token
      XENDIT_REDIRECT_BASE_URL: https://example.invalid/xendit-redirect
      PHILSMS_API_TOKEN: ci-test-token
      PHILSMS_SENDER_ID: HomeEase
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-test-anon-key
      SUPABASE_SERVICE_KEY: ci-test-service-key
      SUPABASE_KYC_BUCKET: kyc-documents
      SUPABASE_RESUME_BUCKET: resumes
      SUPABASE_CHAT_BUCKET: chat-images
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: claude-sonnet-5
      MAX_FILE_SIZE: "5242880"
      UPLOAD_DIR: uploads
      ALLOWED_ORIGINS: http://localhost:5173
      COMMISSION_RATE: "0.10"
      WITHHOLDING_TAX_RATE: "0.02"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm run typecheck:tooling
      - run: npm test
      # Exercises the real BullMQ queues against a real (ephemeral,
      # redis-memory-server-provisioned) Redis — npm test above mocks these
      # exact modules out, so this is what actually catches a real-queue
      # regression (see jest.integration.config.js).
      - run: npm run test:queues

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vite build

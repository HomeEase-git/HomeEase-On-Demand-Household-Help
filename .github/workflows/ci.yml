name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeease_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homeease_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/homeease_ci
      NODE_ENV: test
      PORT: 3000
      APP_URL: http://localhost:3000
      JWT_SECRET: ci-test-jwt-secret
      # Seconds, not a duration string — src/utils/jwt.ts's getJwtExpiry()
      # does Number.parseInt() on this (it pre-computes expiresIn itself
      # rather than letting jsonwebtoken parse "1h"/"7d" directly), so "1h"
      # silently parsed to 1 (second): every token minted in a beforeAll
      # expired well before the test file finished, 401-ing every request
      # that came more than ~1s after login. 3600 = 1 hour.
      JWT_EXPIRY: "3600"
      SMTP_USER: ci-test@example.com
      SMTP_PASS: ci-test-app-password
      XENDIT_SECRET_KEY: ci-test-secret
      XENDIT_WEBHOOK_TOKEN: ci-test-webhook-token
      XENDIT_REDIRECT_BASE_URL: https://example.invalid/xendit-redirect
      PHILSMS_API_TOKEN: ci-test-token
      PHILSMS_SENDER_ID: HomeEase
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-test-anon-key
      SUPABASE_SERVICE_KEY: ci-test-service-key
      SUPABASE_KYC_BUCKET: kyc-documents
      SUPABASE_RESUME_BUCKET: resumes
      SUPABASE_CHAT_BUCKET: chat-images
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: claude-sonnet-5
      MAX_FILE_SIZE: "5242880"
      UPLOAD_DIR: uploads
      ALLOWED_ORIGINS: http://localhost:5173
      COMMISSION_RATE: "0.10"
      WITHHOLDING_TAX_RATE: "0.02"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js's realtime-js constructs a WebSocket at
          # `createClient()` time (src/config/supabase.ts, imported at
          # module scope by several route files) and needs Node's native
          # WebSocket global, stable only from Node 22 — Node 20 fails
          # every test file importing that chain with "Node.js detected
          # but native WebSocket not found." Must match (or exceed) the
          # backend Dockerfile's node:22-bookworm-slim.
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Fails the build on a new high/critical vuln in a production
      # dependency (dev-only tooling is excluded). `prisma` (the CLI) stays
      # a prod dependency because docker-entrypoint.sh runs `prisma migrate
      # deploy` at container start after an `npm ci --omit=dev` install —
      # it pulls in @prisma/dev's local-dev-server code, which this repo
      # never invokes but which drags along outdated nested packages; see
      # the `overrides` block in package.json, which pins those to patched
      # versions (exact, not caret, so they can't drift outside this file).
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm run typecheck:tooling
      # tsc --noEmit only type-checks; this compiles + rewrites path aliases
      # (tsc-alias) so a `dist/` that can't actually `require()` its own
      # modules fails CI instead of only blowing up at deploy time.
      - run: npm run build
      - run: npm test
      # Exercises the real BullMQ queues against a real (ephemeral,
      # redis-memory-server-provisioned) Redis — npm test above mocks these
      # exact modules out, so this is what actually catches a real-queue
      # regression (see jest.integration.config.js).
      - run: npm run test:queues

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx vite build

  # Keeps the deploy artifacts honest — a broken Dockerfile / entrypoint /
  # multi-stage copy fails here instead of at deploy time.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Keep backend awake

# Render's free tier puts the backend to sleep after ~15 minutes with no
# requests. While asleep, BullMQ's in-process jobs (payouts, reminders,
# payment reconciliation) stop, Xendit webhooks wait 30-60s for a cold start,
# and the first person to open the app waits too. A light /health request
# every 5 minutes (GitHub's shortest schedule) keeps it awake most of the time.
#
# Best effort only: GitHub can delay scheduled runs 5-15 min under load, so an
# occasional sleep still happens. For reliable uptime use an external pinger
# (UptimeRobot, 5-min) or a paid Render plan — see DEPLOY.md. Free for this
# public repo (Actions minutes are unlimited on public repositories). Delete
# this workflow once the service is on a paid plan, which never sleeps.
#
# Uses the same repo variable as cron-sweeps.yml: RENDER_URL.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health
        run: |
          curl --fail --show-error --silent --max-time 90 --retry 2 --retry-delay 10 \
            "${{ vars.RENDER_URL }}/health"
